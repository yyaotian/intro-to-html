<!DOCTYPE html>
<html>
<head>
  <title>Challenge 3</title>
  <style>
    p {
      margin-top:0px;
      margin-bottom:0;
      font-family: Arial;
      font-size:16px;
    }
    
    .all {
      border:1px solid grey;
      border-radius:7px;
      padding-left:15px;
      padding-right:15px;
      padding-top:15px;
      padding-bottom:15px;
      max-width:20%;
    }

    .row {
      display:flex;
      margin-bottom:5px;
    }

    .text {
      flex:1;
    }

    .button {
      max-width:30%;
      background-color: rgb(39, 126, 255);
      color: white;
      border:none;
      border-radius:15px;
      padding:3px 9px;
      transition: background-color 0.15s;
    }

    .button:hover {
      background-color: rgb(0, 81, 255);
      cursor:pointer;
    }
  </style>
</head>

<body>
  <div class="all">
    <div class="row">
      <p class="text">Home</p>
      <button class="button">14</button>
    </div>

    <div class="row">
      <p class="text">Notifications</p>
      <button class="button">3</button>
    </div>

    <div class="row">
      <p class="text">Messages</p>
      <button class="button">5</button>
    </div>
  </div>
  
</body>
</html>
